# Ultralytics YOLOv8n + lightweight BiFPN-style neck + DentalECA.

nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  # Top-down path. First input in each BiFPN_Add is the target output scale.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[6, 10], 1, BiFPN_Add2, [512]] # 11-P4/16
  - [-1, 3, C2f, [512]] # 12-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[4, 13], 1, BiFPN_Add2, [256]] # 14-P3/8
  - [-1, 3, C2f, [256]] # 15-P3/8

  # Bottom-up refinement with lightweight three-way weighted fusion.
  - [-1, 1, Conv, [256, 3, 2]] # 16-P4/16
  - [[12, 16, 6], 1, BiFPN_Add3, [512]] # 17-P4/16
  - [-1, 3, C2f, [512]] # 18-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 19-P5/32
  - [[9, 19, 12], 1, BiFPN_Add3, [1024]] # 20-P5/32
  - [-1, 3, C2f, [1024]] # 21-P5/32

  - [15, 1, DentalECA, [3]] # 22-P3 attention
  - [18, 1, DentalECA, [3]] # 23-P4 attention
  - [21, 1, DentalECA, [3]] # 24-P5 attention
  - [[22, 23, 24], 1, Detect, [nc]]
